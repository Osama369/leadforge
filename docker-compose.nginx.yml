# For servers that already run nginx on 80/443 (no Caddy).
# The app listens only on 127.0.0.1:8010; nginx (deploy/nginx-leadforge.conf) proxies to it, certbot adds HTTPS.
#   docker compose -f docker-compose.nginx.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8010:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
