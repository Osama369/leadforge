# /etc/nginx/sites-available/leadforge.conf
# Certificate (webroot, same as the other sites on this server):
#   certbot certonly --webroot -w /var/lib/leadforge/acme -d leadforge.aspiredigital.pk --deploy-hook "systemctl reload nginx"
server {
    listen 80;
    listen [::]:80;
    server_name leadforge.aspiredigital.pk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/leadforge/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leadforge.aspiredigital.pk;

    ssl_certificate     /etc/letsencrypt/live/leadforge.aspiredigital.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leadforge.aspiredigital.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
